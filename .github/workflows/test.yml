name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read package manager
        id: package-manager
        run: jq -r '"version=\(.packageManager)"' package.json >> "$GITHUB_OUTPUT"

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.10.15
          cache: true
          cache_key_prefix: mise-v1-${{ steps.package-manager.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check

      - name: Type check
        run: pnpm test:types

      - name: Build
        run: pnpm build
